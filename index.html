<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <title>Welcome | Raze</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
      <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;500;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="stage" id="app-stage" role="application" aria-label="Comic Design">
        <div class="bg-container" id="bg-container">
            <div class="bg-layer active" id="bg-layer-landing" style="background-image: url('assets/bg1.png');" ></div>
            <div class="bg-layer" id="bg-layer-me" style="background-image: url('assets/bg2.png');"></div>
            <div class="bg-layer" id="bg-layer-projects" style="background-image: url('assets/bg3.png');"></div>
            <div class="bg-layer" id="bg-layer-hobbies" style="background-image: url('assets/bg4.png');"></div> 
            
        </div>
        <header class="scene-header">
            <div class="title-tag">Portfolio</div>
        </header>

    <section class="landing-scene" id="landing-scene">
        <div class="tiles-cluster">
        <div class="nav-tile" data-index="0">
            <div class="tile-focus-indicator">
                <span class="key-tag">1</span>
            </div>
            <div class="tile-art-wrapper">
                <img src="assets/Group 25.png" alt="Me Navigation Tile" class="tile-image">
            </div>
        </div>
        <div class="nav-tile" data-index="1">
            <div class="tile-focus-indicator">
                <span class="key-tag">2</span>
            </div>
            <div class="tile-art-wrapper">
                <img src="assets/Group 26.png" alt="Projects" class="tile-image">
            </div>
        </div>
        <div class="nav-tile" data-index="2">
            <div class="tile-focus-indicator">
                <span class="key-tag">3</span>
            </div>
            <div class="tile-art-wrapper">
                <img src="assets/Group 27.png" alt="Projects" class="tile-image">
            </div>
        </div>
        </div>
    </section>
    </main>



    <!-- tutorial footer -->
    <footer class="controls-hud">
        <div class="hud-item" id="hud-nav">
            <span class="hud-key">←</span>
            <span class="hud-key">→</span>
            <span class="hud-desc" id="hud-nav-desc">Navigate</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item" id="hud-enter">
            <span class="hud-key">ENTER</span>
            <span class="hud-desc" id="hud-enter -desc">Select</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item" id="hud-esc">
            <span class="hud-key">ESC</span>
            <span class="hud-desc">Back</span>
        </div>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
